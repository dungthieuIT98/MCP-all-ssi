# Mẫu tham khảo theo pattern của argocd-config/trino.yaml trong repo
# data-platform-infrastructure. File này KHÔNG nằm trong repo hạ tầng —
# khi đồng ý, nội dung tương đương sẽ được thêm vào
# data-platform-infrastructure/argocd-config/mcp-trino.yaml,
# cùng với việc copy deploy/manifests/*.yaml sang
# data-platform-infrastructure/mcp-trino/manifests/, theo đúng quy trình CR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-trino
  annotations:
    argocd.argoproj.io/sync-wave: "4" # sau data-trino (wave 3)
spec:
  project: data-platform
  source:
    repoURL: "https://gitlab.ssi.com.vn/dto-data/data-platform-infrastructure.git"
    targetRevision: main
    path: mcp-trino/manifests
  destination:
    name: ho-data-cluster
    namespace: mcp-trino
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
