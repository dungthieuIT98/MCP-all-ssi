apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-trino
  namespace: dataplatform
  labels:
    app: mcp-trino
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mcp-trino
  template:
    metadata:
      labels:
        app: mcp-trino
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: mcp-trino
          image: harbor.ssi.com.vn/dataplatform/mcp-trino:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3010

          envFrom:
            - configMapRef:
                name: mcp-trino-config
          env:
            - name: TRINO_USER
              valueFrom:
                secretKeyRef:
                  name: mcp-trino-credentials
                  key: TRINO_USER
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-trino-credentials
                  key: TRINO_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
