# KHÔNG commit file thật lên Git. Đây chỉ là mẫu để tạo Secret thủ công
# (kubectl apply -f) hoặc qua cơ chế secret manager của team hạ tầng (Vault/ESO).
#
# kubectl create secret generic mcp-trino-credentials \
#   --namespace mcp-trino \
#   --from-literal=TRINO_USER='<service-account-user>' \
#   --from-literal=TRINO_PASSWORD='<service-account-password>'
apiVersion: v1
kind: Secret
metadata:
  name: mcp-trino-credentials
  namespace: mcp-trino
type: Opaque
stringData:
  TRINO_USER: "__REPLACE_ME__"
  TRINO_PASSWORD: "__REPLACE_ME__"
