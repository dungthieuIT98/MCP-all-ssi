apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-trino
  namespace: mcp-trino
  labels:
    app: mcp-trino
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mcp-trino
  template:
    metadata:
      labels:
        app: mcp-trino
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mcp-trino
          image: harbor.ssi.com.vn/dataflatform/mcp-trino:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TRINO_HOST
              value: "trino.trino.svc.cluster.local"
            - name: TRINO_PORT
              value: "8080"
            - name: TRINO_SCHEME
              value: "http"
            - name: TRINO_SSL
              value: "false"
            - name: TRINO_CATALOG
              value: "__DEFAULT_CATALOG__"
            - name: TRINO_SCHEMA
              value: "__DEFAULT_SCHEMA__"
            - name: TRINO_USER
              valueFrom:
                secretKeyRef:
                  name: mcp-trino-credentials
                  key: TRINO_USER
            - name: TRINO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-trino-credentials
                  key: TRINO_PASSWORD
            - name: TRINO_ENABLE_IMPERSONATION
              value: "true"
            - name: TRINO_ALLOW_WRITE_QUERIES
              value: "false"
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
