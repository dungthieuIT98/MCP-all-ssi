_format_version: "3.0"
_transform: true

# Kong is a bare reverse proxy — no auth plugin, no consumers. Identity and
# key validation happen in auth-proxy itself via the X-Profile-Key header
# (see proxy.py:_resolve_username / db.get_username_by_api_key).
services:
  - name: auth-proxy
    url: http://auth-proxy:6275
    routes:
      - name: auth-proxy-mcp
        paths:
          - /mcp
        strip_path: false
        preserve_host: false
      - name: auth-proxy-root
        paths:
          - /
        strip_path: false
        preserve_host: false
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - X-Profile-Key
          credentials: true
