services:
  # ── MySQL ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=demo
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - trino-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Trino ─────────────────────────────────────────────────────────
  trino:
    image: "trinodb/trino:424"
    container_name: trino
    hostname: trino
    ports:
      - "8090:8080"
    volumes:
      - ./mcp-trino/trino-conf/catalog:/etc/trino/catalog
      - ./mcp-trino/trino-conf/access-control.properties:/etc/trino/access-control.properties
      - ./mcp-trino/trino-conf/rules.json:/etc/trino/rules.json
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Trino MCP Server ──────────────────────────────────────────────
  trino-mcp:
    build:
      context: ./mcp-trino
      dockerfile: Dockerfile
    container_name: trino-mcp
    ports:
      - "6274:8080"
    environment:
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_USER=trino
      - TRINO_CATALOG=mysql
      - TRINO_SCHEMA=demo
      - TRINO_SCHEME=http
      - MCP_TRANSPORT=http
      - MCP_PORT=8080
      # OAuth Azure AD
      - OAUTH_ENABLED=true
      - OAUTH_MODE=proxy
      - OAUTH_PROVIDER=azure
      - OIDC_ISSUER=https://sts.windows.net/${AZURE_TENANT_ID}/
      - OIDC_AUDIENCE=${AZURE_CLIENT_ID}
      - OIDC_CLIENT_ID=${AZURE_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=http://localhost:6274/oauth/callback
      - JWT_SECRET=${JWT_SECRET}
      # Impersonation
      - TRINO_ENABLE_IMPERSONATION=true
      - TRINO_IMPERSONATION_FIELD=email
    depends_on:
      trino:
        condition: service_healthy
    networks:
      - trino-net

  # ── Superset ──────────────────────────────────────────────────────
  superset:
    build:
      context: .
      dockerfile: superset.Dockerfile
    container_name: superset
    hostname: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - SUPERSET_ADMIN_USERNAME=${SUPERSET_ADMIN_USERNAME}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD}
      - SUPERSET_ADMIN_EMAIL=${SUPERSET_ADMIN_EMAIL}
      - SUPERSET_CONFIG_PATH=/app/superset_home/superset_config.py
      # Azure AD OAuth
      - OAUTH_CLIENT_ID=${AZURE_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - OAUTH_TENANT_ID=${AZURE_TENANT_ID}
    volumes:
      - superset-data:/app/superset_home
      - ./superset_config.py:/app/superset_home/superset_config.py
    networks:
      - trino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    command:
      - sh
      - -c
      - >-
        superset db upgrade &&
        superset fab create-admin
          --username $$SUPERSET_ADMIN_USERNAME
          --firstname Admin
          --lastname User
          --email $$SUPERSET_ADMIN_EMAIL
          --password $$SUPERSET_ADMIN_PASSWORD 2>/dev/null || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088

  # ── Superset MCP ──────────────────────────────────────────────────
  superset-mcp:
    build:
      context: ./mcp-superset
      dockerfile: Dockerfile
    container_name: superset-mcp
    ports:
      - "6276:8000"
    environment:
      - SUPERSET_BASE_URL=http://superset:8088
      - SUPERSET_USERNAME=${SUPERSET_ADMIN_USERNAME}
      - SUPERSET_PASSWORD=${SUPERSET_ADMIN_PASSWORD}
    depends_on:
      superset:
        condition: service_healthy
    networks:
      - trino-net
    restart: unless-stopped

  # ── Auth Proxy ────────────────────────────────────────────────────
  auth-proxy:
    build:
      context: ./auth-proxy
      dockerfile: Dockerfile
    container_name: auth-proxy
    env_file:
      - ./.env
      - ./auth-proxy/.env
    environment:
      - UPSTREAM_URL=http://trino-mcp:8080/mcp
    ports:
      - "6275:6275"
    volumes:
      - auth-proxy-cache:/app/cache
    depends_on:
      - trino-mcp
    networks:
      - trino-net
    restart: unless-stopped

volumes:
  mysql-data:
  auth-proxy-cache:
  superset-data:

networks:
  trino-net:
    driver: bridge
