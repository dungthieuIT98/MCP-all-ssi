services:
  # ── MySQL ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=demo
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - trino-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Trino ─────────────────────────────────────────────────────────
  trino:
    image: "trinodb/trino:424"
    container_name: trino
    hostname: trino
    ports:
      - "8090:8080"
    volumes:
      - ./mcp-trino/trino-conf/catalog:/etc/trino/catalog
      - ./mcp-trino/trino-conf/access-control.properties:/etc/trino/access-control.properties
      - ./mcp-trino/trino-conf/rules.json:/etc/trino/rules.json
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trino-net
    healthcheck:
      # /v1/info returns 200 while the engine is still initializing, which lets
      # trino-mcp start too early and crash on "server is still initializing".
      # Gate on the JSON "starting":false field so dependents wait for a ready engine.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Trino MCP Server ──────────────────────────────────────────────
  trino-mcp:
    build:
      context: ./mcp-trino
      dockerfile: Dockerfile
    container_name: trino-mcp
    ports:
      - "6274:8080"
    environment:
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_USER=trino
      - TRINO_CATALOG=mysql
      - TRINO_SCHEMA=demo
      - TRINO_SCHEME=http
      - MCP_TRANSPORT=http
      - MCP_PORT=8080
      # Impersonation: principal comes from the X-User-Email header, which MUST
      # be set (and stripped from client input) by a trusted upstream gateway
      # (e.g. Kong/auth-proxy) that has already authenticated the caller.
      - TRINO_ENABLE_IMPERSONATION=true
    depends_on:
      trino:
        condition: service_healthy
    networks:
      - trino-net
    restart: unless-stopped
    healthcheck:
      # trino-mcp only exposes /status, /mcp, /sse — /status needs no OAuth
      # (see mcp-trino/internal/mcp/server.go:handleStatus). alpine ships wget via busybox.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Superset ──────────────────────────────────────────────────────
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: superset-azure:4.1.1
    container_name: superset
    hostname: superset
    ports:
      - "8088:8088"
    environment:
      # Signs session cookies / CSRF tokens and encrypts DB connection passwords
      # in Superset metadata. Do NOT delete — Superset refuses to start without it.
      # Regenerate with: openssl rand -base64 42
      - SUPERSET_SECRET_KEY=Vet8cnOAdkVYOa+ObhE0Uw3oa8BiA/4k5MgBKxoiWPG3jz2BXfoEnB6v
      - SUPERSET_LOAD_EXAMPLES=no
      - FLASK_APP=superset
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_EMAIL=admin@superset.com
      # Tells Superset to load our superset_config.py (Azure OAuth lives there).
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
      # ── Azure AD (Microsoft Entra ID) OAuth — from Azure App registration ──
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
    volumes:
      # Persists the default SQLite metadata DB (/app/superset_home). Swap for a
      # dedicated Postgres in production — SQLite is single-writer and not for prod.
      - superset-home:/app/superset_home
      # Mount our Azure OAuth config onto Superset's pythonpath.
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    networks:
      - trino-net
    command:
      - /bin/bash
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin \
          --username "$${ADMIN_USERNAME}" \
          --firstname Admin --lastname User \
          --email "$${ADMIN_EMAIL}" \
          --password "$${ADMIN_PASSWORD}" || true
        superset init
        exec gunicorn --bind 0.0.0.0:8088 --workers 4 --timeout 120 \
          "superset.app:create_app()"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Superset MCP Server ───────────────────────────────────────────
  superset-mcp:
    build:
      context: ./mcp-superset
      dockerfile: Dockerfile
    container_name: superset-mcp
    ports:
      # main.py serves the streamable-http app on 8000
      - "6275:8000"
    environment:
      - SUPERSET_BASE_URL=http://superset:8088
    depends_on:
      superset:
        condition: service_healthy
    networks:
      - trino-net
    restart: unless-stopped

volumes:
  mysql-data:
  superset-home:

networks:
  trino-net:
    driver: bridge
